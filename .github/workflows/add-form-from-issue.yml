name: Add Form from Issue

on:
  issues:
    types:
      - labeled

permissions:
  contents: write
  issues: write

env:
  DATA_BRANCH: forms-data

jobs:
  add-form:
    if: github.event.issue.pull_request == null && contains(github.event.issue.labels.*.name, 'aprovado')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Checkout data branch
        run: |
          git fetch origin ${{ env.DATA_BRANCH }}:${{ env.DATA_BRANCH }} || true
          git checkout ${{ env.DATA_BRANCH }} || git checkout -b ${{ env.DATA_BRANCH }}

      - name: Parse issue form
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || "";

            const getField = (labels) => {
              const labelList = Array.isArray(labels) ? labels : [labels];
              for (const label of labelList) {
                const regex = new RegExp(`### ${label}\\s*\\n([\\s\\S]*?)(?=\\n### |$)`, "i");
                const match = body.match(regex);
                if (match) {
                  return match[1].trim().split("\n")[0].trim();
                }
              }
              return "";
            };

            const normalizeDeadline = (value) => {
              if (!value) return "";
              const trimmed = value.trim();
              const normalized = trimmed.replace(/\//g, "-");
              const ymd = normalized.match(/^(\d{4})-(\d{2})-(\d{2})$/);
              if (ymd) {
                const [, year, month, day] = ymd;
                return `${day}-${month}-${year}`;
              }
              return normalized;
            };

            const author = getField("Autor");
            const theme = getField("Tema");
            const url = getField(["Link do formulario", "Link do formulário"]);
            const deadline = normalizeDeadline(
              getField(["Prazo (opcional)", "Prazo", "Deadline (opcional)", "Deadline"])
            );

            if (!author || !theme || !url) {
              core.setFailed("Missing required fields in issue form.");
              return;
            }

            core.setOutput("author", author);
            core.setOutput("theme", theme);
            core.setOutput("url", url);
            core.setOutput("deadline", deadline);

      - name: Add form to JSON
        run: |
          node scripts/add-form.js \
            "${{ steps.parse.outputs.author }}" \
            "${{ steps.parse.outputs.theme }}" \
            "${{ steps.parse.outputs.url }}" \
            "${{ steps.parse.outputs.deadline }}"

      - name: Generate README
        run: node scripts/generate-readme.js

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/forms.json README.md
          git commit -m "Add form from issue #${{ github.event.issue.number }}"
          git push -u origin ${{ env.DATA_BRANCH }}

      - name: Close issue
        uses: actions/github-script@v7
        with:
          script: |
            const rawBase = `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}`;
            const dataUrl = `${rawBase}/${process.env.DATA_BRANCH}/data/forms.json`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Formulario adicionado com sucesso.\n\nJSON atualizado: ${dataUrl}`
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed"
            });
